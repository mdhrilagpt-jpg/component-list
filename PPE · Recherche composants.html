<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PPE · Recherche composants</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ind:#372682;--ind2:#2a1d66;--tint:#ecebf6;--gry:#bcbcbc;--bg:#f1f1f6;--panel:#fff;--ink:#1d1a33;--mut:#6f6c85;--line:#dcdbe8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif;min-height:100vh}
.top{background:#fff;border-bottom:4px solid var(--ind);position:relative}
.top:after{content:"";position:absolute;left:0;bottom:-4px;height:4px;width:28%;background:var(--gry)}
.top>div{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top img{height:38px;width:auto;display:block}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.eyebrow{font:600 11px 'JetBrains Mono',monospace;letter-spacing:.14em;color:var(--ind);text-transform:uppercase}
h1{font:700 clamp(30px,8vw,44px)/1 'Barlow Condensed',sans-serif;margin:4px 0 14px;text-transform:uppercase;color:var(--ind)}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 12px}
.box{display:flex;align-items:center;background:#fff;border:2px solid var(--ind);border-radius:14px;padding:0 6px 0 14px;box-shadow:0 4px 0 var(--gry)}
.box:focus-within{box-shadow:0 4px 0 var(--ind)}
input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:600 20px 'JetBrains Mono',monospace;padding:16px 4px;outline:0;text-transform:uppercase}
input::placeholder{color:var(--mut);font-weight:400;text-transform:none;font-size:15px}
.x{border:0;background:none;color:var(--mut);font-size:24px;width:44px;height:44px;cursor:pointer;visibility:hidden}
.x.on{visibility:visible}
.hint{font:12px 'JetBrains Mono',monospace;color:var(--mut);margin:10px 2px 0}
.sec{font:600 11px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:20px 2px 8px}
.list{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:#fff;color:var(--ind);border-radius:999px;padding:9px 14px;font:600 14px 'JetBrains Mono',monospace;cursor:pointer}
.sug{display:flex;justify-content:space-between;width:100%;text-align:left;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:14px;font:600 15px 'JetBrains Mono',monospace;cursor:pointer;margin-bottom:8px}
.sug small{color:var(--mut);font-weight:400}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px;box-shadow:0 2px 10px rgba(55,38,130,.08)}
.ch{padding:16px;background:var(--ind);color:#fff;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ch label{display:block;font:600 10px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#c9c4ee;text-transform:uppercase}
.ch b{display:block;font:700 clamp(18px,5.4vw,26px) 'JetBrains Mono',monospace;word-break:break-all;margin-top:3px}
.g{padding:14px 16px;border-top:1px solid var(--line)}
.g:first-of-type{border-top:0}
.gt{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.gt h3{font:700 19px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.05em;margin:0;color:var(--ind)}
.gt span{font:12px 'JetBrains Mono',monospace;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:10px;background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px;cursor:pointer;color:var(--ink);font:inherit}
.chip i{font:600 17px 'JetBrains Mono',monospace;font-style:normal}
.chip em{font:700 14px 'JetBrains Mono',monospace;font-style:normal;background:var(--ind);color:#fff;border-radius:7px;padding:3px 8px}
.chip.ok{outline:2px solid var(--ind)}
.empty{text-align:center;color:var(--mut);padding:36px 12px;font:14px 'JetBrains Mono',monospace}
.locked .wrap,.locked .top .bar{display:none}
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
.ov.on{display:flex}
.dlg{width:100%;max-width:440px;background:#fff;border-top:6px solid var(--ind);border-radius:18px;box-shadow:0 8px 30px rgba(55,38,130,.18);padding:22px;max-height:94vh;overflow:auto}
.dlg img{height:44px;display:block;margin-bottom:14px}
.dlg h2{font:700 28px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:6px 0 16px;color:var(--ind)}
.f{display:block;margin-bottom:12px}.f span{display:block;font:600 10px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.f input{width:100%;border:1px solid var(--line);background:#fafafd;border-radius:10px;padding:12px;font:600 16px 'JetBrains Mono',monospace;text-transform:none}
.f input:focus{border-color:var(--ind)}
.btn{border:0;background:var(--ind);color:#fff;border-radius:12px;padding:13px 18px;font:700 18px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.btn.g2{background:var(--tint);color:var(--ind)}
.row{display:flex;gap:10px;margin-top:6px}.row .btn{flex:1}
.err{color:#c4262e;font:13px 'JetBrains Mono',monospace;min-height:18px;margin:4px 0}
.bar{display:flex;gap:8px;align-items:center}
.tb{border:1px solid var(--line);background:#fff;color:var(--ind);border-radius:10px;height:40px;padding:0 12px;font:600 13px 'JetBrains Mono',monospace;cursor:pointer}
.tb.a{background:var(--ind);color:#fff;border-color:var(--ind)}
.tag{font:700 10px 'JetBrains Mono',monospace;background:var(--gry);color:var(--ind2);border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:middle}
.del{border:0;background:none;color:#c4262e;font:600 12px 'JetBrains Mono',monospace;padding:12px 16px;cursor:pointer;width:100%;text-align:right;border-top:1px solid var(--line)}
.fs{max-height:44vh;overflow:auto;padding-right:2px}
